name: Build Android APK 🚗📱

on:
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildAndroid:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout repository with Git LFS
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # 2. Cache Unity Library folder for faster subsequent builds
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-Android-
            Library-

      # 4. Run Unity Android Build using GameCI
      - name: Run Unity Android Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.20f1
          androidExportType: 'androidPackage' # Generates .apk directly
          buildMethod: CarGame.EditorTools.AndroidQuickBuildUtility.BuildAndroidAPK

      # 5. Upload APK as GitHub Actions Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SunriseHatchback_Simulator_APK
          path: |
            Builds/Android/*.apk
            build/Android/*.apk
          retention-days: 14
          if-no-files-found: error
